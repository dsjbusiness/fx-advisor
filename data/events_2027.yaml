# FX Advisor - kalendarz wydarzen makro 2027
#
# Format jak w events_2026.yaml (parser: data_layer.load_events).
#   date = dzien OGLOSZENIA (dla posiedzen: drugi dzien).
#   Publikacje po fixingu EBC (Fed, BLS) sa przez narzedzie przesuwane na
#   nastepna sesje jako "dzien reakcji" (config.LATE_SOURCES).
#
# Stan weryfikacji (2026-09-07):
#   ECB  - ZWERYFIKOWANE z ecb.europa.eu (kalendarz posiedzen 2027)
#   Fed  - ZWERYFIKOWANE z federalreserve.gov (kalendarz FOMC 2027, tentatywny
#          do potwierdzenia na poprzednim posiedzeniu)
#   NBP  - ORIENTACYJNE: harmonogram RPP 2027 jeszcze nieopublikowany;
#          wg konwencji 2026 (pierwsza wt-sr miesiaca; styczen/kwiecien/lipiec
#          druga). ZWERYFIKUJ na nbp.pl po publikacji (zwykle w XI-XII 2026).
#   BLS  - ORIENTACYJNE: harmonogram 2027 nieopublikowany; CPI ~10-14. dnia,
#          NFP pierwszy piatek. ZWERYFIKUJ na bls.gov/schedule (publikacja XII 2026).
#   GUS  - ORIENTACYJNE wg konwencji (flash ostatni dzien roboczy, final ~15.).

